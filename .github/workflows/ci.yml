name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }}, python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    # Windows support is new and unproven: report it without blocking merges.
    # make required once green on GitHub (owner decision 2026-11-07)
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        # "file" = the floor in .python-version; "3.x" = the latest release. Each on all three OSes.
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["file", "3.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version != 'file' && matrix.python-version || '' }}
          python-version-file: ${{ matrix.python-version == 'file' && '.python-version' || '' }}
      # Keep this version in sync with RUFF_VERSION in tools/dev.py.
      - name: Install pinned ruff and pytest
        run: python -m pip install ruff==0.17.4 pytest==9.1.1
      # Needs no game, Wine, DLL/PDB, minidump or CIV4DBG_TEST_DATA directory: real-binary tests skip themselves.
      - name: Check
        run: python -I tools/dev.py check
