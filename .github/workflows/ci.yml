name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }}, python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # "3.11" = the floor (latest 3.11 patch: setup-python has no 3.11.18 build for macOS arm64 or Windows);
        # "3.x" = the latest release. Each on all three OSes. .python-version is for local development only.
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.x"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      # Keep this version in sync with RUFF_VERSION in tools/dev.py.
      - name: Install pinned ruff and pytest
        run: python -m pip install ruff==0.17.4 pytest==9.1.1
      # Needs no game, Wine, DLL/PDB, minidump or CIV4DBG_TEST_DATA directory: real-binary tests skip themselves.
      - name: Check
        run: python -I tools/dev.py check
